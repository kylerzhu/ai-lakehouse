# Paimon catalog：与 Flink 使用同一个 warehouse（共享卷 /data/paimon）
spark.sql.catalog.paimon                org.apache.paimon.spark.SparkCatalog
spark.sql.catalog.paimon.warehouse      file:/data/paimon
spark.sql.extensions                    org.apache.paimon.spark.extensions.PaimonSparkSessionExtensions

# 资源：本地模式，容器 mem_limit 为 2g
spark.master                            local[2]
spark.driver.memory                     1g
spark.sql.shuffle.partitions            4
spark.default.parallelism               4

# 运行用户 uid 9999 没有家目录，缓存与临时文件放到 /tmp
spark.jars.ivy                          /tmp/.ivy2
spark.local.dir                         /tmp/spark
spark.sql.warehouse.dir                 /tmp/spark-warehouse
spark.ui.showConsoleProgress            false

# spark-sql 命令行会启动内置的 Derby 元数据库（只给 spark_catalog 用；本项目的表都在 paimon catalog 里）。
# 默认建在当前目录，而工作目录是只读挂载，所以挪到 /tmp。
spark.hadoop.javax.jdo.option.ConnectionURL   jdbc:derby:;databaseName=/tmp/metastore_db;create=true
spark.driver.extraJavaOptions                 -Dderby.system.home=/tmp/derby
